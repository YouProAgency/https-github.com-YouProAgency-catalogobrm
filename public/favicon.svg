<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001844" />
      <stop offset="100%" stop-color="#0B2B68" />
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="14" fill="url(#gradBg)" />

  <!-- Accent bottom stripes -->
  <rect x="0" y="58" width="64" height="6" rx="3" fill="#FFDD00" />
  <rect x="0" y="54" width="64" height="4" fill="#E60000" />

  <!-- Official BRM Monogram & Eletrodiesel Ray Symbol -->
  <g transform="translate(6, 12)">
    <!-- Letters "BR" in red -->
    <text x="2" y="30" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#E60000" letter-spacing="-1">BR</text>
    <!-- Gear & Lightning bolt on right -->
    <g transform="translate(40, 20)">
      <circle cx="0" cy="0" r="10" fill="#001F5C" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Lightning bolt in red -->
      <polygon points="6,-14 -2,-1 1,1 -5,14 3,0 0,-1" fill="#E60000" />
    </g>
  </g>
</svg>
